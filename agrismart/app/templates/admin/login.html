<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Room Operator Login - AgriSmart</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    
    <style>
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        
        .admin-login-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-box {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: 2.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body>
    <div class="admin-login-glow"></div>

    <div class="login-box">
        <div style="text-align:center;margin-bottom:1.75rem;">
            <div style="width:48px;height:48px;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:#10b981;margin-bottom:0.75rem;box-shadow:0 0 15px rgba(16,185,129,0.3);">
                <i data-lucide="shield-alert" style="width:26px;height:26px;"></i>
            </div>
            <h2 style="font-size:1.5rem;font-weight:700;font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em;">AgriSmart Control Room</h2>
            <span style="font-size:0.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;">Authorized Personnel Only</span>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="margin-bottom:1.25rem;">
                    {% for category, message in messages %}
                        <div style="padding:0.75rem 1rem;border-radius:var(--radius-md);font-size:0.85rem;background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;display:flex;align-items:center;gap:0.5rem;">
                            <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0;"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin.login') }}">
            <div style="margin-bottom:1.25rem;">
                <label style="font-size:0.825rem;color:#94a3b8;font-weight:600;display:block;margin-bottom:0.4rem;">Operator Username</label>
                <div style="position:relative;">
                    <i data-lucide="user" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#64748b;"></i>
                    <input type="text" name="username" required autofocus placeholder="admin"
                        style="width:100%;padding:0.75rem 1rem 0.75rem 2.5rem;background:#090d16;border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-md);color:#f8fafc;font-size:0.95rem;outline:none;transition:border-color 0.2s;">
                </div>
            </div>

            <div style="margin-bottom:1.5rem;">
                <label style="font-size:0.825rem;color:#94a3b8;font-weight:600;display:block;margin-bottom:0.4rem;">Access Key / Password</label>
                <div style="position:relative;">
                    <i data-lucide="lock" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#64748b;"></i>
                    <input type="password" name="password" required placeholder="••••••••"
                        style="width:100%;padding:0.75rem 1rem 0.75rem 2.5rem;background:#090d16;border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-md);color:#f8fafc;font-size:0.95rem;outline:none;transition:border-color 0.2s;">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;background:linear-gradient(135deg, #059669, #047857);box-shadow:0 0 20px rgba(16,185,129,0.3);">
                <i data-lucide="log-in"></i>
                <span>Authenticate Session</span>
            </button>
        </form>

        <div style="text-align:center;margin-top:1.5rem;">
            <a href="{{ url_for('main.index') }}" style="font-size:0.8rem;color:#64748b;transition:color 0.2s;">
                ← Return to Public Platform
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
