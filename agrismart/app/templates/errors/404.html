{% extends "base.html" %}

{% block title %}Page Not Found - AgriSmart{% endblock %}

{% block content %}
<div class="page-container" style="display:flex;align-items:center;justify-content:center;min-height:70vh;">
    <div class="glass-card" style="text-align:center;max-width:480px;padding:3rem 2rem;">
        <div class="empty-state-icon" style="width:72px;height:72px;background:rgba(245,158,11,0.15);color:var(--color-amber);">
            <i data-lucide="compass" style="width:36px;height:36px;"></i>
        </div>
        <h1 style="font-size:3rem;font-weight:800;font-family:var(--font-heading);color:var(--color-forest-green);margin-bottom:0.25rem;">404</h1>
        <h3 style="font-size:1.25rem;margin-bottom:0.5rem;">Plot Coordinates Not Found</h3>
        <p style="font-size:0.875rem;color:var(--text-tertiary);margin-bottom:1.5rem;">
            The agricultural advisory page you are looking for has been relocated or does not exist.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i data-lucide="home"></i>
            <span>Return to Homepage</span>
        </a>
    </div>
</div>
{% endblock %}
